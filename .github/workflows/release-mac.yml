name: macOS app

# Builds unsigned V.I.S.O.R. .dmg files (Apple Silicon + Intel) on demand.
on:
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          ANTHROPIC_API_KEY: ""
      - run: pnpm dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: visor-dmg
          path: release/dist/*.dmg
          if-no-files-found: error
