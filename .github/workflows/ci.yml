name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: App (daemon, GUI, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          # The Linux jobs never launch the desktop app
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          ANTHROPIC_API_KEY: ""
      - run: pnpm build

  site:
    name: Website & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          # The Linux jobs never launch the desktop app
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm --filter visor-site lint
      - run: pnpm --filter visor-site typecheck
      - run: pnpm --filter visor-site build
